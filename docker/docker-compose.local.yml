version: '3.8'

services:
  trick-surf-db:
    image: mysql:8.4
    container_name: trick-surf-db-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # === Database ===
      MYSQL_USER: ${MYSQL_USER:-surfgxds}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-surfgxds}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-surfgxds_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-surfgxds_root_pwd}
    ports:
      - "3306:3306"
    volumes:
      - local_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-surfgxds_root_pwd} --silent"]
      interval: 3s
      timeout: 3s
      retries: 5

  trick-surf-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: trick-surf-server:local
    container_name: trick-surf-server-local
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      trick-surf-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # === App Core ===
      PORT: "8080"
      HOST: "0.0.0.0"
      NODE_ENV: "development"

      # === Database ===
      DATABASE_URL: mysql://${MYSQL_USER:-surfgxds}:${MYSQL_PASSWORD:-surfgxds}@trick-surf-db:3306/${MYSQL_DATABASE:-surfgxds_dev}

      # === APM (signoz) ===
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: "trick-surf-server"

      # === Redirects / CORS ===
      FRONTEND_URL: "http://localhost:3334"
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}

  trick-surf-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    image: trick-surf-client:local
    container_name: trick-surf-client-local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3334:3334"
    environment:
      # === App Config ===
      VITE_API_URL: "http://localhost:8080"
      VITE_CDN_URL: ${VITE_CDN_URL:-}

      # === APM (signoz) ===
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      - trick-surf-server

volumes:
  local_mysql_data:
