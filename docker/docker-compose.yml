version: '3.8'

services:
  trick-surf-db:
    image: mysql:8.4
    environment:
      MYSQL_USER: ${MYSQL_USER:-surfgxds}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-surfgxds}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-surfgxds}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-surfgxds_root_pwd}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-surfgxds_root_pwd} --silent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod-net
    deploy:
      restart_policy:
        condition: any

  trick-surf-server:
    image: ${REGISTRY:-docker.io}/injurka/trick-surf-server:${V_SERVER:-latest}
    depends_on:
      - trick-surf-db
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      DATABASE_URL: mysql://${MYSQL_USER:-surfgxds}:${MYSQL_PASSWORD:-surfgxds}@trick-surf-db:3306/${MYSQL_DATABASE:-surfgxds}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-ingester:4318}
      OTEL_SERVICE_NAME: "trick-surf-server"
      FRONTEND_URL: https://${DOMAIN_CLIENT:-trick-surf.limited-dissolve.ru}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
    networks:
      - prod-net
    deploy:
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=prod-net"
        - "traefik.http.routers.trick-server.rule=Host(`${DOMAIN_API:-trick-surf-api.limited-dissolve.ru}`)"
        - "traefik.http.routers.trick-server.entrypoints=websecure"
        - "traefik.http.routers.trick-server.tls=true"
        - "traefik.http.services.trick-server.loadbalancer.server.port=8080"

  trick-surf-client:
    image: ${REGISTRY:-docker.io}/injurka/trick-surf-client:${V_CLIENT:-latest}
    environment:
      VITE_API_URL: https://${DOMAIN_API:-trick-surf-api.limited-dissolve.ru}
      VITE_CDN_URL: ${VITE_CDN_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    networks:
      - prod-net
    deploy:
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=prod-net"
        - "traefik.http.routers.trick-client.rule=Host(`${DOMAIN_CLIENT:-trick-surf.limited-dissolve.ru}`)"
        - "traefik.http.routers.trick-client.entrypoints=websecure"
        - "traefik.http.routers.trick-client.tls=true"
        - "traefik.http.services.trick-client.loadbalancer.server.port=3334"

volumes:
  mysql_data:

networks:
  prod-net:
    external: true
    name: prod-net
